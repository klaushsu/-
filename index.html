<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動態擲杯抽靈籤｜功德隨喜</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <h1>🏮 動態擲杯擲筊 & 靈籤抽取 🏮</h1>

    <div class="cup-box">
      <div class="cup c1" id="cup1"></div>
      <div class="cup c2" id="cup2"></div>
    </div>

    <div class="cup-area" id="cupRes">點擊按鈕開始擲杯</div>
    <button id="throwBtn">開始擲杯</button>

    <hr>
    <div class="lot-area" id="lotRes">擲出聖筊才可抽籤</div>
    <button id="lotBtn" disabled>抽取靈籤</button>

    <hr>
    <div class="merit-block">
      <h3>🙏 功德隨喜</h3>
      <p>隨喜護持宮廟，廣結善緣</p>
      <a id="donateBtn" target="_blank" href="#">
        <div class="donate-button">前往隨喜捐款</div>
      </a>
      <p class="tip">點擊將開新視窗至捐款頁</p>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
