<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>城隍爺六十靈籤｜線上擲杯抽籤</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <h1>🏯 城隍爺六十靈籤</h1>

    <div class="cup-box">
      <div class="cup"></div>
      <div class="cup"></div>
    </div>

    <div class="cup-area" id="cupRes">請點擊下方按鈕擲杯問事</div>
    <div class="count-text" id="countText">已累計聖杯：0 / 3</div>
    <button id="throwBtn">開始擲杯</button>

    <hr>
    <div class="lot-area" id="lotBox"></div>
    <button id="lotBtn" disabled>抽取城隍靈籤</button>

    <hr>
    <div class="merit-block">
      <h3>🙏 功德隨喜</h3>
      <p>心誠則靈，行善積福自有庇佑</p>
      <a id="donateBtn" target="_blank" href="#">
        <div class="donate-button">隨喜布施</div>
      </a>
      <p class="tip">點擊將開啟新視窗</p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
